services:
  backend:
    build: ./backend
    environment:
      ONTOVIEW_ENVIRONMENT: production
      ONTOVIEW_LOG_LEVEL: INFO
      ONTOVIEW_DATA_DIR: /data
      ONTOVIEW_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      ONTOVIEW_NETWORK_IMPORTS_ENABLED: "false"
    volumes:
      - onto-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  onto-data:
